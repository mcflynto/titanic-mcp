# Writable working database for the demo (OP-01). In production, use a managed PostgreSQL service.
apiVersion: v1
kind: Secret
metadata: {name: postgres, namespace: titanic-mcp}
type: Opaque
stringData:
  POSTGRES_USER: tmcp
  POSTGRES_PASSWORD: demo-postgres-password-change-me   # placeholder
  POSTGRES_DB: titanic_working
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: titanic-mcp}
spec:
  selector: {app: postgres}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: titanic-mcp}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom: [{secretRef: {name: postgres}}]
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, tmcp, -d, titanic_working]}
            periodSeconds: 5
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes: [{name: run, emptyDir: {}}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
