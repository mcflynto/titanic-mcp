# Trace backend for the demo (MON-03). It receives OTLP on port 4317.
apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: titanic-mcp}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.10.0
          ports: [{containerPort: 4317, name: otlp-grpc}, {containerPort: 16686, name: ui}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: titanic-mcp}
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: ui, port: 16686, targetPort: 16686, nodePort: 30686}
