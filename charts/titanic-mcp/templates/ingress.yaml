{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tmcp.fullname" . }}
  labels: {{- include "tmcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the MCP endpoint and the OAuth metadata go through the ingress. Not /metrics, not /healthz.
          - path: /mcp
            pathType: Exact
            backend: {service: {name: {{ include "tmcp.fullname" . }}, port: {name: http}}}
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend: {service: {name: {{ include "tmcp.fullname" . }}, port: {name: http}}}
{{- end }}
